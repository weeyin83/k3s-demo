apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-arc-content
  namespace: arc-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Sarah's Azure Arc Demo</title>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #f4f7f9;
          color: #17212b;
          font-family: Georgia, serif;
        }

        main {
          width: min(680px, calc(100% - 48px));
          border-top: 6px solid #0078d4;
          background: white;
          padding: 48px;
          box-shadow: 0 18px 50px rgba(23, 33, 43, 0.12);
        }

        h1 {
          margin: 0 0 16px;
          font-size: clamp(2rem, 7vw, 4rem);
        }

        p {
          font-size: 1.15rem;
          line-height: 1.7;
        }

        .status {
          display: inline-block;
          margin-top: 20px;
          padding: 8px 12px;
          border-left: 4px solid #2e8540;
          background: #edf7ef;
          font-family: monospace;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>Hello from K3s</h1>
        <p>
          This website is running on my Ubuntu server in Hyper-V and is
          managed from Azure using Azure Arc and Flux GitOps.
        </p>
        <p>
          The application remains on-premises. Its desired configuration
          is stored in GitHub and continuously reconciled onto Kubernetes.
        </p>
        <div class="status">k3s-hyperv-demo: connected</div>
      </main>
    </body>
    </html>
