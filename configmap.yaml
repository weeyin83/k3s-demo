apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-arc-content
  namespace: arc-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Sarah's Azure Arc Demo</title>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #f4f7f9;
          color: #17212b;
          font-family: Georgia, serif;
        }

        main {
          width: min(680px, calc(100% - 48px));
          border-top: 6px solid #0078d4;
          background: white;
          padding: 48px;
          box-shadow: 0 18px 50px rgba(23, 33, 43, 0.12);
        }

        h1 {
          margin: 0 0 16px;
          font-size: clamp(2rem, 7vw, 4rem);
        }

        p {
          font-size: 1.15rem;
          line-height: 1.7;
        }

        .details {
          display: grid;
          grid-template-columns: max-content 1fr;
          gap: 10px 20px;
          margin-top: 28px;
          padding: 20px;
          border-left: 4px solid #0078d4;
          background: #eef6fc;
          font-family: monospace;
        }

        .label {
          font-weight: bold;
        }

        .status {
          color: #217a36;
          font-weight: bold;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>Hello from K3s</h1>

        <p>
          This website is running on my Ubuntu server in Hyper-V and is
          managed from Azure using Azure Arc and Flux GitOps.
        </p>

        <p>
          The application remains on-premises. Its desired configuration
          is stored in GitHub and continuously reconciled onto Kubernetes.
        </p>

        <div class="details">
          <span class="label">Cluster</span>
          <span>k3s-hyperv-demo</span>

          <span class="label">Status</span>
          <span class="status">Connected</span>

          <span class="label">Demo version</span>
          <span>Version 1</span>

          <span class="label">Last updated</span>
          <span>11 September 2026, 10:00</span>
        </div>
      </main>
    </body>
    </html>
